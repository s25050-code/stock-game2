  <script>
    let currentGuideSlide = 1;
    const totalGuideSlides = 4;

    function openGuideModal() {
      const modal = document.getElementById('guideModal');
      modal.classList.remove('hidden');
      setTimeout(() => modal.classList.remove('opacity-0'), 10);
      showGuideSlide(1);
    }

    function closeGuideModal() {
      const modal = document.getElementById('guideModal');
      modal.classList.add('opacity-0');
      setTimeout(() => modal.classList.add('hidden'), 300);
    }

    function changeGuideSlide(direction) {
      const target = currentGuideSlide + direction;
      if (target >= 1 && target <= totalGuideSlides) {
        showGuideSlide(target);
      }
    }

    function showGuideSlide(slideIndex) {
      currentGuideSlide = slideIndex;
      for (let i = 1; i <= totalGuideSlides; i++) {
        const slide = document.getElementById(`guideSlide${i}`);
        if (slide) {
          if (i === slideIndex) {
            slide.classList.remove('hidden');
          } else {
            slide.classList.add('hidden');
          }
        }
      }

      // Update Navigation Buttons
      const prevBtn = document.getElementById('guidePrevBtn');
      const nextBtn = document.getElementById('guideNextBtn');
      const startBtn = document.getElementById('guideStartBtn');

      if (prevBtn) prevBtn.disabled = (slideIndex === 1);

      if (slideIndex === totalGuideSlides) {
        if (nextBtn) nextBtn.classList.add('hidden');
        if (startBtn) startBtn.classList.remove('hidden');
      } else {
        if (nextBtn) nextBtn.classList.remove('hidden');
        if (startBtn) startBtn.classList.add('hidden');
      }

      // Update Dots
      const dotsContainer = document.getElementById('guideDots');
      if (dotsContainer) {
        const dots = dotsContainer.children;
        for (let i = 0; i < dots.length; i++) {
          if (i === slideIndex - 1) {
            dots[i].className = 'w-3 h-3 rounded-full bg-blue-500 transition-all';
          } else {
            dots[i].className = 'w-2.5 h-2.5 rounded-full bg-slate-600 transition-all';
          }
        }
      }
    }

    // Show guide modal on page initial load
    window.addEventListener('DOMContentLoaded', () => {
      openGuideModal();
    });
  </script>

        // Initialize Stock Price Histories

            COMPANIES.forEach(comp => {
                let startPrice = comp.basePrice;
                let history = [];
                // Generate initial 5 historical data points
                for (let i = -4; i <= 0; i++) {
                    let change = (Math.random() - 0.48) * comp.volatility * startPrice;
                    let close = Math.max(100, Math.round(startPrice + change));
                    let high = Math.round(Math.max(startPrice, close) + Math.random() * 20);
                    let low = Math.round(Math.min(startPrice, close) - Math.random() * 20);
                    history.push({
                        period: i,
                        open: startPrice,
                        high: high,
                        low: low,
                        close: close
                    });
                    startPrice = close;
                }

                gameState.stocks[comp.id] = {
                    history: history,
                    owned: 0,
                    avgPrice: 0,
                    dcaAmount: 0
                };
            });
        }

        // --- Core Simulation Logic ---

        // Buy Logic
        function executeBuy() {
            const comp = COMPANIES.find(c => c.id === gameState.activeCompanyId);
            const stock = gameState.stocks[comp.id];
            const price = stock.history[stock.history.length - 1].close;
            const qty = parseInt(document.getElementById('buyQtyInput').value) || 0;

            if (qty <= 0 || qty % 100 !== 0) {
                alert('注文単位は100株単位で入力してください。');
                return;
            }

            const totalCost = price * qty;
            if (totalCost > gameState.cash) {
                alert('利用可能現金が不足しています。');
                return;
            }

            // Execute transaction
            gameState.cash -= totalCost;
            const totalOwned = stock.owned + qty;
            stock.avgPrice = Math.round(((stock.owned * stock.avgPrice) + totalCost) / totalOwned);
            stock.owned = totalOwned;
            gameState.tradeCount++;

            // Check Achievements
            unlockBadge('first_buy');
            checkPortfolioAchievements();
            checkBenefitCards(comp.id, stock.owned);

            // Check Contrarian Badge
            const prevPrice = stock.history[stock.history.length - 2].close;
            if ((price - prevPrice) / prevPrice <= -0.05) {
                unlockBadge('contrarian');
            }

            renderAll();
        }

        // Sell Logic
        function executeSell() {
            const comp = COMPANIES.find(c => c.id === gameState.activeCompanyId);
            const stock = gameState.stocks[comp.id];
            const price = stock.history[stock.history.length - 1].close;
            const qty = parseInt(document.getElementById('sellQtyInput').value) || 0;

            if (qty <= 0 || qty % 100 !== 0) {
                alert('注文単位は100株単位で入力してください。');
                return;
            }

            if (qty > stock.owned) {
                alert('保有している株式数を超えています。');
                return;
            }

            // Execute sell
            const totalGain = price * qty;
            gameState.cash += totalGain;
            stock.owned -= qty;
            if (stock.owned === 0) stock.avgPrice = 0;
            gameState.tradeCount++;

            // Dip buyer achievement
            if (price > stock.avgPrice) {
                unlockBadge('dip_buyer');
            }

            renderAll();
        }

        // Advance Turn (Day or Week)
        function advanceTurn() {
            if (gameState.currentTurn >= gameState.maxTurns) {
                generateReflectionReport();
                unlockBadge('complete_10d');
                return;
            }

            gameState.currentTurn++;

            // Process Random Event Trigger (15% chance)
            let eventOccurred = null;
            if (Math.random() < 0.25) {
                eventOccurred = MARKET_EVENTS[Math.floor(Math.random() * MARKET_EVENTS.length)];
            }

            // Update Stock Prices for all companies
            COMPANIES.forEach(comp => {
                const stock = gameState.stocks[comp.id];
                const lastClose = stock.history[stock.history.length - 1].close;

                let changePct = (Math.random() - 0.49) * comp.volatility;

                // Apply Event Impact if matched
                if (eventOccurred && eventOccurred.target === comp.id) {
                    changePct += eventOccurred.effect;
                }

                let newClose = Math.max(50, Math.round(lastClose * (1 + changePct)));
                let open = lastClose;
                let high = Math.round(Math.max(open, newClose) * (1 + Math.random() * 0.015));
                let low = Math.round(Math.min(open, newClose) * (1 - Math.random() * 0.015));

                stock.history.push({
                    period: gameState.currentTurn,
                    open: open,
                    high: high,
                    low: low,
                    close: newClose
                });

                // Long Term Mode DCA (Dollar Cost Averaging) Execution
                if (gameState.mode === 'long' && stock.dcaAmount > 0) {
                    let dcaQty = Math.floor(stock.dcaAmount / newClose / 100) * 100;
                    if (dcaQty > 0 && gameState.cash >= dcaQty * newClose) {
                        gameState.cash -= dcaQty * newClose;
                        let totalOwned = stock.owned + dcaQty;
                        stock.avgPrice = Math.round(((stock.owned * stock.avgPrice) + (dcaQty * newClose)) / totalOwned);
                        stock.owned = totalOwned;
                        unlockBadge('dca_master');
                    }
                }

                // Long Term Mode Dividends (Quarterly at Week 13, 26, 39, 52)
                if (gameState.mode === 'long' && stock.owned > 0 && gameState.currentTurn % 13 === 0) {
                    let dividendPerShare = Math.round(newClose * 0.015); // ~1.5% dividend yield
                    let divPayout = dividendPerShare * stock.owned;
                    gameState.cash += divPayout;
                    gameState.totalDividends += divPayout;
                    if (gameState.totalDividends >= 10000) unlockBadge('dividend_earner');
                }
            });

            // Update News Ticker Bar
            if (eventOccurred) {
                document.getElementById('newsTickerContent').innerText = `${eventOccurred.text}`;
            }

            // Check Overall Asset Achievements
            checkAssetAchievements();

            renderAll();
        }

        // --- HTML Canvas Chart Renderer (Line & Candlestick) ---
        function resizeCanvas() {
            if (!chartCanvas) return;
            const rect = chartCanvas.parentElement.getBoundingClientRect();
            chartCanvas.width = rect.width;
            chartCanvas.height = rect.height;
        }

        function renderChart() {
            if (!chartCtx) return;
            const comp = COMPANIES.find(c => c.id === gameState.activeCompanyId);
            const history = gameState.stocks[comp.id].history;

            const w = chartCanvas.width;
            const h = chartCanvas.height;

            chartCtx.clearRect(0, 0, w, h);

            if (history.length === 0) return;

            // Compute min and max bounds
            let minP = Infinity, maxP = -Infinity;
            history.forEach(item => {
                if (item.low < minP) minP = item.low;
                if (item.high > maxP) maxP = item.high;
            });
            const padding = (maxP - minP) * 0.15 || 50;
            minP -= padding;
            maxP += padding;

            const getX = (idx) => 40 + (idx / (history.length - 1 || 1)) * (w - 60);
            const getY = (val) => h - 30 - ((val - minP) / (maxP - minP)) * (h - 50);

            // Draw Background Grid Lines
            chartCtx.strokeStyle = '#334155';
            chartCtx.lineWidth = 0.5;
            for (let i = 0; i <= 4; i++) {
                let gridY = 20 + i * ((h - 50) / 4);
                let val = Math.round(maxP - i * ((maxP - minP) / 4));
                chartCtx.beginPath();
                chartCtx.moveTo(40, gridY);
                chartCtx.lineTo(w - 10, gridY);
                chartCtx.stroke();

                chartCtx.fillStyle = '#94a3b8';
                chartCtx.font = '10px sans-serif';
                chartCtx.fillText(`¥${val}`, 5, gridY + 3);
            }

            // Draw Line Chart
            if (gameState.chartType === 'line') {
                chartCtx.beginPath();
                history.forEach((item, idx) => {
                    let x = getX(idx);
                    let y = getY(item.close);
                    if (idx === 0) chartCtx.moveTo(x, y);
                    else chartCtx.lineTo(x, y);
                });
                chartCtx.strokeStyle = '#6366f1';
                chartCtx.lineWidth = 2.5;
                chartCtx.stroke();

                // Gradient Fill under line
                chartCtx.lineTo(getX(history.length - 1), h - 30);
                chartCtx.lineTo(getX(0), h - 30);
                chartCtx.closePath();
                let gradient = chartCtx.createLinearGradient(0, 0, 0, h);
                gradient.addColorStop(0, 'rgba(99, 102, 241, 0.3)');
                gradient.addColorStop(1, 'rgba(99, 102, 241, 0)');
                chartCtx.fillStyle = gradient;
                chartCtx.fill();
            } 
            // Draw Candlestick Chart
            else {
                const candleWidth = Math.max(6, Math.min(20, (w - 60) / history.length - 4));

                history.forEach((item, idx) => {
                    let x = getX(idx);
                    let yOpen = getY(item.open);
                    let yClose = getY(item.close);
                    let yHigh = getY(item.high);
                    let yLow = getY(item.low);

                    let isUp = item.close >= item.open;
                    let candleColor = isUp ? '#10b981' : '#ef4444';

                    // High Low Wick Line
                    chartCtx.strokeStyle = candleColor;
                    chartCtx.lineWidth = 1.5;
                    chartCtx.beginPath();
                    chartCtx.moveTo(x, yHigh);
                    chartCtx.lineTo(x, yLow);
                    chartCtx.stroke();

                    // Candle Body
                    chartCtx.fillStyle = candleColor;
                    let top = Math.min(yOpen, yClose);
                    let height = Math.max(2, Math.abs(yClose - yOpen));
                    chartCtx.fillRect(x - candleWidth / 2, top, candleWidth, height);
                });
            }
        }

                        <div class="text-[10px] font-semibold leading-tight line-clamp-2">${isUnlocked ? detailText : '？？？（株式数が不足）'}</div>
                        <div class="text-[9px] text-right ${isUnlocked ? 'text-amber-300 font-bold' : 'text-slate-600'}">
                            ${isUnlocked ? '<i class="fa-solid fa-circle-check"></i> 優待獲得済' : `あと ${(tier.threshold - stock.owned)} 株`}
                        </div>
                    `;

                    grid.appendChild(card);
                });
            });

            document.getElementById('benefitUnlockedCount').innerText = `${unlockedCount} / 18 獲得`;
        }

        // Render Achievement Badges
        function renderBadges() {
            const grid = document.getElementById('badgesGrid');
            grid.innerHTML = '';

            let unlockedCount = gameState.unlockedBadges.length;

            ACHIEVEMENTS.forEach(badge => {
                const isUnlocked = gameState.unlockedBadges.includes(badge.id);

                const card = document.createElement('div');
                card.className = `p-2 rounded-xl border text-center flex flex-col items-center justify-center space-y-1 transition ${
                    isUnlocked ? 'border-amber-500/50 bg-amber-950/30 text-slate-100 shadow-md' : 'border-slate-800/80 bg-slate-950/30 text-slate-600 opacity-50'
                }`;

                card.innerHTML = `
                    <div class="text-xl">${badge.icon}</div>
                    <div class="text-[10px] font-bold line-clamp-1">${badge.name}</div>
                `;
                card.title = `${badge.name}: ${badge.desc}`;

                grid.appendChild(card);
            });

            document.getElementById('badgeUnlockedCount').innerText = `${unlockedCount} / 15 獲得`;
        }

        // AI Advisor Prompt Engine
        function updateAIAdvisor() {
            const adviceBox = document.getElementById('aiAdvisorMessage');
            const activeComp = COMPANIES.find(c => c.id === gameState.activeCompanyId);
            const stock = gameState.stocks[activeComp.id];
            const history = stock.history;
            const rsi = calculateRSI(history);

            let msg = `「現在【${activeComp.name}】をチェック中だな。`;

            if (rsi < 35) {
                msg += `RSIが${rsi}まで低下しているぞ！売られすぎ（割安）のシグナルかもしれないから、買いを検討してもいいかも！」`;
            } else if (rsi > 70) {
                msg += `RSIが${rsi}と高く、買われすぎの警戒感が出ているぞ。高値掴みに注意して利益確定も視野に入れよう！」`;
            } else if (stock.owned === 0) {
                msg += `まずは余剰資金を使って100株買ってみることで、株価の動きに対する関心が高まるぞ！」`;
            } else {
                msg += `順調に保有できているな。1つの銘柄に集中させず、他業種の銘柄にも投資して分散リスクを管理しよう！」`;
            }

            adviceBox.innerText = msg;
        }

        // Calculate RSI (Relative Strength Index)
        function calculateRSI(history) {
            if (history.length < 5) return 50;
            let gains = 0, losses = 0;
            for (let i = history.length - 4; i < history.length; i++) {
                let diff = history[i].close - history[i - 1].close;
                if (diff >= 0) gains += diff;
                else losses += Math.abs(diff);
            }
            if (gains + losses === 0) return 50;
            return Math.round((gains / (gains + losses)) * 100);
        }

        // Unlock Badge Trigger
        function unlockBadge(badgeId) {
            if (!gameState.unlockedBadges.includes(badgeId)) {
                gameState.unlockedBadges.push(badgeId);
                savePersistentData();
                triggerConfetti();
                renderBadges();
            }
        }

        function checkPortfolioAchievements() {
            let ownedCount = 0;
            COMPANIES.forEach(c => {
                if (gameState.stocks[c.id].owned > 0) ownedCount++;
            });

            if (ownedCount >= 3) unlockBadge('diversified_3');
            if (ownedCount >= 6) unlockBadge('diversified_6');
            if (gameState.tradeCount >= 10) unlockBadge('trader_10');
        }

        function checkBenefitCards(compId, ownedQty) {
            BENEFIT_TIERS.forEach(tier => {
                if (ownedQty >= tier.threshold) {
                    const cardKey = `${compId}_${tier.threshold}`;
                    if (!gameState.unlockedBenefits.includes(cardKey)) {
                        gameState.unlockedBenefits.push(cardKey);
                        if (tier.threshold === 1000) unlockBadge('collector_gold');
                        savePersistentData();
                        triggerConfetti();
                    }
                }
            });

            if (gameState.unlockedBenefits.length >= 3) unlockBadge('collector_3');
        }

        function checkAssetAchievements() {
            let totalVal = gameState.cash;
            COMPANIES.forEach(c => {
                totalVal += gameState.stocks[c.id].owned * gameState.stocks[c.id].history[gameState.stocks[c.id].history.length - 1].close;
            });

            if (totalVal >= 1200000) unlockBadge('asset_120');
            if (totalVal >= 1500000) unlockBadge('asset_150');
            if (totalVal >= 2000000) unlockBadge('asset_200');
        }

        // Reflection & Learning Report Generator
        function generateReflectionReport() {
            let totalVal = gameState.cash;
            let ownedSectors = new Set();
            COMPANIES.forEach(c => {
                if (gameState.stocks[c.id].owned > 0) {
                    ownedSectors.add(c.sector);
                    totalVal += gameState.stocks[c.id].owned * gameState.stocks[c.id].history[gameState.stocks[c.id].history.length - 1].close;
                }
            });

            const netReturn = totalVal - gameState.initialCapital;
            const netReturnPct = ((netReturn / gameState.initialCapital) * 100).toFixed(1);

            // Diagnose Investment Style
            let styleType = 'バランス型投資家';
            let evaluation = '';

            if (ownedSectors.size >= 4) {
                styleType = '堅実・分散インカムゲイン型';
                evaluation = '複数の業界に資金をバランス良く分散配置し、市場全体の変動リスクを最小限に抑える優れたポートフォリオを構築できました。総合学習の観点からも非常に高いリス管理能力が発揮されています。';
            } else if (gameState.tradeCount >= 8) {
                styleType = 'アクティブ・ハイリスクモメンタム型';
                evaluation = '短期的な価格変動を積極的に狙うデイトレードスタイルで取引を展開しました。高い収益性を狙える反面、取引手数料や高値掴みのリスクが存在することを学べました。';
            } else if (netReturn > 0) {
                styleType = '着実利殖型アナリスト';
                evaluation = '企業のニュースや指標（RSI・移動平均）を慎重に読み合わせ、確実性の高いタイミングで投資を実行し、見事に資産をプラスへ導きました。';
            } else {
                styleType = '逆境挑戦型チャレンジャー';
                evaluation = '市場の予期せぬ暴落やニュースの変動により一時的な損失が発生しましたが、失敗の原因分析（高値買い・集中投資）を行うことで、株式市場の厳しさとリスク分散の必要性を実感できました。';
            }

            document.getElementById('reportDateText').innerText = `日付: ${new Date().toLocaleDateString('ja-JP')}`;
            document.getElementById('reportModeText').innerText = gameState.mode === 'short' ? '短期投資 (10日)' : '長期投資 (52週)';
            document.getElementById('reportFinalAsset').innerText = `¥${totalVal.toLocaleString()}`;
            document.getElementById('reportReturnRate').innerText = `${netReturn >= 0 ? '+' : ''}${netReturnPct}%`;
            document.getElementById('reportTradeCount').innerText = `${gameState.tradeCount} 回`;

            document.getElementById('reportStyleType').innerText = styleType;
            document.getElementById('reportEvaluationText').innerText = evaluation;

            document.getElementById('reportModal').classList.remove('hidden');
        }

        function copyReportToClipboard() {
            const reportArea = document.getElementById('reportPrintArea');
            const textContent = `
【株式投資シミュレーション 授業振り返りシート】
------------------------------------------------
モード: ${document.getElementById('reportModeText').innerText}
最終総資産: ${document.getElementById('reportFinalAsset').innerText}
総収益率: ${document.getElementById('reportReturnRate').innerText}
総取引回数: ${document.getElementById('reportTradeCount').innerText}

■ 投資スタイル診断:
${document.getElementById('reportStyleType').innerText}

■ 総合評価:
${document.getElementById('reportEvaluationText').innerText}

■ 得られた気づきと今後の課題:
${document.getElementById('reportUserNotes').value || '（未記述）'}
------------------------------------------------
            `.trim();

            navigator.clipboard.writeText(textContent).then(() => {
                alert('レポートテキストをクリップボードにコピーしました！ワークシート等に貼り付けて提出できます。');
            });
        }

        // Particle Confetti Effect
        function triggerConfetti() {
            const canvas = document.getElementById('confettiCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            let particles = [];
            for (let i = 0; i < 70; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12 - 4,
                    color: `hsl(${Math.random() * 360}, 90%, 60%)`,
                    size: Math.random() * 6 + 4,
                    life: 100
                });
            }

            function animateConfetti() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;
                particles.forEach(p => {
                    if (p.life > 0) {
                        alive = true;
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.2; // gravity
                        p.life--;
                        ctx.fillStyle = p.color;
                        ctx.fillRect(p.x, p.y, p.size, p.size);
                    }
                });
                if (alive) requestAnimationFrame(animateConfetti);
            }
            animateConfetti();
        }
    </script>
